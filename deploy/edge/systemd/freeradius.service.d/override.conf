# =============================================================================
# WAVLY WIFI - FreeRADIUS systemd override
# =============================================================================
# Install as /etc/systemd/system/freeradius.service.d/override.conf, then:
#     systemctl daemon-reload && systemctl restart freeradius
#
# Debian's stock unit already runs as freerad:freerad and is broadly sane. This
# override adds three things that matter on a box in a village with unreliable
# power, and hardens what it safely can.
# =============================================================================

[Unit]
# Start AFTER Postgres and, more importantly, do not start at all if it failed.
#
# Without this, FreeRADIUS comes up during boot before the database accepts
# connections, the sql module fails to initialise its pool, and depending on the
# version the server either retries forever or starts with no authorization
# capability - rejecting every customer with no obvious cause. On a machine that
# loses power regularly this is a common boot order, not a rare one.
After=network-online.target postgresql.service
Wants=network-online.target
Requires=postgresql.service

[Service]
# A UPS keeps the box alive through short outages, but not through a brownout
# that wedges Postgres. RADIUS is the thing that must come back without a human
# driving to the site, so it restarts unconditionally - and quickly, because
# "the Wi-Fi is down" is reported within minutes.
Restart=always
RestartSec=3s
StartLimitIntervalSec=0

# Bound the damage from a leak. FreeRADIUS is single-threaded per request with a
# thread pool; a slow client or a pathological query can grow memory. On a small
# machine shared with Postgres and syncd, an OOM that kills the wrong process is
# worse than a restart of the right one.
MemoryMax=512M
TasksMax=64

# --- hardening ---------------------------------------------------------------
# Deliberately conservative. FreeRADIUS must write to /var/log/freeradius and
# /var/run/freeradius and must be able to open UDP sockets, so the aggressive
# options (ProtectSystem=strict, PrivateNetwork, RestrictAddressFamilies) would
# break it. Everything below is safe for this workload and still removes the
# easy escalation paths from a service that sits on an untrusted LAN.
NoNewPrivileges=yes
PrivateTmp=yes
ProtectHome=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
LockPersonality=yes
# Only the syscalls a RADIUS server plausibly needs. Note this is the option most
# likely to need adjustment across glibc versions - if the service fails to start
# with EPERM after an OS upgrade, check the journal for a seccomp violation
# before disabling it.
SystemCallFilter=@system-service
SystemCallArchitectures=native

[Install]
WantedBy=multi-user.target
