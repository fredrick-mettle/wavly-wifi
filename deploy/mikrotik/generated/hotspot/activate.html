<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Wavly WiFi — Activating</title>
<style>:root{--bg:#0f172a;--fg:#f8fafc;--mut:#94a3b8;--acc:#22c55e;--err:#f87171;--card:#1e293b;--line:#334155}@media (prefers-color-scheme:light){:root{--bg:#f1f5f9;--fg:#0f172a;--mut:#475569;--card:#fff;--line:#e2e8f0}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}.card{max-width:26rem;margin:0 auto;padding:1.25rem 1.1rem calc(1.25rem + env(safe-area-inset-bottom))}.brand{display:flex;align-items:center;gap:.7rem;margin-bottom:1rem}.logo{display:grid;place-items:center;width:2.4rem;height:2.4rem;border-radius:.6rem;background:var(--acc);color:#052e16;font-weight:800;font-size:1.2rem;flex:none}h1{margin:0;font-size:1.15rem;line-height:1.2}.sub{margin:.1rem 0 0;color:var(--mut);font-size:.8rem}.lede{margin:.2rem 0 1rem}.lede.ok{color:var(--acc);font-weight:600}.err{color:var(--err)}.btn{display:block;width:100%;margin:.5rem 0;padding:.85rem 1rem;border:1px solid var(--line);border-radius:.65rem;background:var(--card);color:var(--fg);font:inherit;font-weight:600;text-align:center;text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent}.btn:active{transform:translateY(1px)}.btn-primary{background:var(--acc);border-color:var(--acc);color:#052e16}label{display:block;margin:.8rem 0 .25rem;font-size:.85rem;color:var(--mut)}input{width:100%;padding:.8rem;border:1px solid var(--line);border-radius:.6rem;background:var(--bg);color:var(--fg);font:inherit}input:focus{outline:2px solid var(--acc);outline-offset:1px}.voucher{margin-top:1.25rem;border-top:1px solid var(--line);padding-top:.75rem}.voucher summary{cursor:pointer;font-weight:600;padding:.5rem 0;color:var(--mut)}.stat{display:grid;grid-template-columns:auto 1fr;gap:.4rem .8rem;margin:0 0 1rem;font-size:.9rem}.stat dt{color:var(--mut)}.stat dd{margin:0;font-variant-numeric:tabular-nums;text-align:right}.fine{color:var(--mut);font-size:.78rem;margin:.6rem 0}footer{margin-top:1.5rem;border-top:1px solid var(--line);padding-top:.75rem}footer a{color:var(--fg)}.spinner{width:1.5rem;height:1.5rem;margin:1rem auto;border-radius:50%;border:3px solid var(--line);border-top-color:var(--acc);animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.offline{margin-top:1rem}</style>
<script src="/md5.js"></script></head>
<body>
<main class="card">
  <header class="brand">
    <span class="logo" aria-hidden="true">W</span>
    <div>
      <h1>Wavly WiFi</h1>
      <p class="sub">Nkawie Main</p>
    </div>
  </header>

  <p class="lede" id="msg">Activating your connection…</p>
  <div class="spinner" id="spin" role="status" aria-live="polite"></div>
  <noscript><p class="err">This step needs JavaScript. Please go back and use a
  voucher code instead, or enable JavaScript and try again.</p></noscript>
  <div id="fail" hidden>
    <p class="err" role="alert"><strong id="failMsg">Activation failed.</strong></p>
    <a class="btn btn-primary" href="https://portal.wavlywifi.com/account">Back to my account</a>
    <p class="fine">You have NOT been charged twice. If this keeps failing, send the code
    shown to <a href="tel:+233244000000">+233244000000</a>.</p>
  </div>

  <!-- Hidden form posts to the hotspot on OUR OWN origin. The browser allows a
       top-level redirect from https: to http:, but it will not let an https: page
       POST to http:. That asymmetry is the whole reason this page exists. -->
  <form name="sendForm" method="post" action="$(link-login-only)" hidden>
    <input type="hidden" name="dst" value="$(link-orig-esc)">
    <input type="hidden" name="popup" value="false">
    $(if chap-id)
    <input type="hidden" name="chap-id" value="$(chap-id)">
    <input type="hidden" name="chap-challenge" value="$(chap-challenge)">
    $(endif)
    <input type="hidden" name="username" value="">
    <input type="hidden" name="password" value="">
  </form>
  <footer>
    <p>Help: <a href="tel:+233244000000">+233244000000</a></p>
    <p class="fine">By connecting you agree to our <a href="https://portal.wavlywifi.com/privacy">privacy notice</a>.</p>
  </footer>
</main>
<script>
(function () {
  var EDGE = 'http://192.168.88.10:8787/activate';
  var TTL_SECONDS = 60;
  var params = new URLSearchParams(location.search);
  var token = params.get('token');
  var mac = '$(mac)';
  var msg = document.getElementById('msg');
  var fail = document.getElementById('fail');
  var failMsg = document.getElementById('failMsg');
  var spin = document.getElementById('spin');

  function die(reason, code) {
    spin.hidden = true;
    fail.hidden = false;
    failMsg.textContent = reason;
    msg.hidden = true;
    // A short, copyable code beats a paragraph a customer has to read aloud.
    if (code) { failMsg.textContent += ' (' + code + ')'; }
  }

  if (!token) {
    die('This activation link is incomplete. Please start again from your account page.', 'NO_TOKEN');
    return;
  }

  msg.textContent = 'Activating your connection…';

  // The token is one-time, MAC-bound and short-lived (see edge table
  // activation_tokens, purged after 5 minutes). It is NOT a payment secret: it
  // only proves the portal already authorised this device.
  fetch(EDGE, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token: token, mac: mac }),
    // Abort rather than hang: a customer staring at a spinner is worse than one
    // reading an error, and the satellite link is the slow part, not the LAN.
    signal: AbortSignal.timeout((TTL_SECONDS + 5) * 1000)
  }).then(function (r) {
    if (!r.ok) { return r.json().catch(function(){return {};}).then(function (b) { throw Object.assign(new Error(b.error || 'rejected'), { code: b.code || ('HTTP_' + r.status) }); }); }
    return r.json();
  }).then(function (creds) {
    if (!creds || !creds.username || !creds.password) {
      die('The activation service sent an incomplete response. Please try again.', 'BAD_PAYLOAD');
      return;
    }
    var f = document.sendForm;
    f.username.value = creds.username;
    f.password.value = creds.password;
    $(if chap-id)
    var chapId = '$(chap-id)';
    var chapChallenge = '$(chap-challenge)';
    if (window.hexMD5) {
      f.password.value = hexMD5(chapId + creds.password + chapChallenge);
    } else {
      die('This page is missing a required file (md5.js). Please tell the operator.', 'NO_MD5');
      return;
    }
    $(endif)
    msg.textContent = 'Connecting you now…';
    // Same-origin POST. This is the step that could not happen from the cloud.
    f.submit();
  }).catch(function (e) {
    var code = e.code || (e.name === 'TimeoutError' || e.name === 'AbortError' ? 'TIMEOUT' : 'NETWORK');
    if (code === 'NETWORK' || code === 'TIMEOUT') {
      die('We could not reach the activation service on the local network. Your payment is safe — please try again in a minute.', code);
    } else {
      die(e.message || 'Activation failed.', code);
    }
  });
})();</script>
</body>
</html>
